name: profile

on:
  schedule:
    - cron: "17 3 * * *"        # daily, 06:17 Riyadh time
  workflow_dispatch:             # "Run workflow" button
  push:
    branches: [main]
    paths: ["profile/**"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  # Rebuilds hero, project cards, timeline, footer + README block
  # whenever profile/content.json (or the generators) change.
  artwork:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python profile/build_assets.py
      - name: Commit rebuilt artwork
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || { git commit -m "chore(profile): rebuild artwork"; git push; }

  # Live stats card + contribution snake → published to the `output` branch.
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli

      - name: Stats card
        run: python profile/build_stats.py --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#7C3AED&color_dots=#ebedf0,#e9d5ff,#c4b5fd,#a78bfa,#7c3aed
            dist/snake-dark.svg?palette=github-dark&color_snake=#A78BFA&color_dots=#161b22,#2e1065,#5b21b6,#7c3aed,#a78bfa

      - name: Publish to output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(profile): refresh activity $(date -u +%F)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
